spring.application.name=hotel-management-system
server.port=8080

# MySQL configuration. Override with environment variables when required.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:hotel_app}
spring.datasource.password=${DB_PASSWORD:hotel123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Explicit dialect keeps startup diagnostics deterministic when DB metadata is temporarily unavailable.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
