services:
  mysql:
    image: mysql:8.4
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_management
      MYSQL_USER: hotel_app
      MYSQL_PASSWORD: hotel123
    ports:
      - "3306:3306"
    volumes:
      - hotel_mysql_data:/var/lib/mysql
volumes:
  hotel_mysql_data:
